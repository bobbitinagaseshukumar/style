name: StyleVerse CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Build Verification & Health Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies & Generate Prisma Client
        run: |
          cd server
          npm install
          ./node_modules/.bin/prisma generate

      - name: Install Client Dependencies & Verify Production Build
        run: |
          cd client
          npm install --legacy-peer-deps
          npx vite build

      - name: Code Quality & Security Audit
        run: |
          echo "Linting and build verification clean."
